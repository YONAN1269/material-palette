# =====================================================================
#  Material Palette 调参文件
#
#  怎么用：
#    1. 用记事本（或任何文本编辑器）打开这个文件
#    2. 改下面三个数字（# 号后面是注释，不用删）
#    3. 保存，双击项目根目录的 rebuild.bat
#    4. VS Code 必须「完全退出」再重新打开（关掉所有窗口，
#       任务管理器里不能有 Code.exe 残留）
#
#  数字范围都是 0 ~ 1，可以写小数，比如 0.35
# =====================================================================


# 侧栏 / 活动栏 / 状态栏 / 标签栏，比编辑区底色暗多少
#   0      = 完全同一个颜色，整个窗口像一张纸（默认，最平）
#   0.03   = 贴脸细看才分得出侧栏在哪
#   0.08   = 像普通主题那样，能明显看到分区
SEAM = 0.0


# 区域之间那条分隔线有多明显
#   注意：这是「黑色阴影」的浓度，不是亮度。
#   0      = 一点线都没有
#   0.19   = 默认，像一道凹进去的细缝
#   0.35   = 能清楚看出分组边界
DIVIDER = 0


# 强调色细线的透明度（当前标签顶部那条、终端面板标题下面那条）
#   这几条是全屏最亮的线，觉得刺眼就往下调
#   0      = 全部去掉，最平
#   0.6    = 默认
#   1.0    = Material 原版那种满色亮线
ACCENT_LINE = 0.6
